---
layout: default
---
<article class="card post-card">
  <span class="post-eyebrow"><span class="banner-dot-live"></span>Daily digest</span>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">← Back to all digests</a>
</article>
