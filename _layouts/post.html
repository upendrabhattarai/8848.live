---
layout: default
---
<article class="card post-card">
  <span class="post-eyebrow">
    <span class="banner-dot-live"></span>
    <span data-lang-en>Daily digest</span>
    <span data-lang-np>दैनिक डाइजेस्ट</span>
  </span>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">
    <span data-lang-en>← Back to all digests</span>
    <span data-lang-np>← सबै डाइजेस्टमा फर्कनुहोस्</span>
  </a>
</article>

<script>
(function () {
  // Record one visit to this digest — read back (not incremented) on the homepage's
  // "Past 10 days" cards to show a real-time cumulative view count per digest.
  var key = '8848live_digest_{{ page.date | date: "%Y-%m-%d" }}';
  fetch('https://countapi.mileshilliard.com/api/v1/hit/' + encodeURIComponent(key)).catch(function () {});
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  var TW_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-6.8L4.5 22H1.4l8.2-9.3L1 2h7.2l5 6.3L18.9 2Zm-1.2 18h1.7L7.4 4H5.6L17.7 20Z"/></svg>';
  var FB_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>';
  var IG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>';

  function slugify(s) {
    return (s || 'outlet').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'outlet';
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function openShareUrl(url) {
    window.open(url, '_blank', 'noopener,width=600,height=520');
  }

  function boxToBlob(box, cb) {
    if (!window.html2canvas) { cb(null); return; }
    var cardBg = getComputedStyle(document.body).getPropertyValue('--bg-card').trim() || '#ffffff';
    html2canvas(box, {
      backgroundColor: cardBg,
      scale: 2,
      useCORS: true,
      ignoreElements: function (el) {
        return !!(el.classList && el.classList.contains('outlet-share-row'));
      }
    }).then(function (canvas) {
      canvas.toBlob(function (blob) { cb(blob); }, 'image/png');
    }).catch(function () { cb(null); });
  }

  document.querySelectorAll('.outlet-box').forEach(function (box) {
    var nameEl = box.querySelector('.outlet-name');
    var name = nameEl ? nameEl.textContent.trim() : 'Nepal News';
    var slug = slugify(name);
    if (!box.id) { box.id = 'outlet-' + slug; }

    var bar = document.createElement('div');
    bar.className = 'outlet-share-row';
    bar.innerHTML =
      '<button type="button" class="share-btn" data-share="twitter" aria-label="Share on X">' + TW_ICON + '</button>' +
      '<button type="button" class="share-btn" data-share="facebook" aria-label="Share on Facebook">' + FB_ICON + '</button>' +
      '<button type="button" class="share-btn" data-share="instagram" aria-label="Share on Instagram">' + IG_ICON + '</button>';
    box.appendChild(bar);

    bar.addEventListener('click', function (e) {
      var btn = e.target.closest('.share-btn');
      if (!btn) return;
      var kind = btn.getAttribute('data-share');
      var pageUrl = location.href.split('#')[0] + '#' + box.id;
      var text = name + ' — top headlines today via 8848.live';

      btn.disabled = true;
      boxToBlob(box, function (blob) {
        btn.disabled = false;
        if (!blob) return;
        var filename = slug + '-8848-live.png';
        var file = new File([blob], filename, { type: 'image/png' });

        if (kind === 'twitter' || kind === 'facebook') {
          // Twitter/X and Facebook's web share links have no way to receive an attached
          // image (and some desktop browsers' native share sheet will silently drop the
          // file when handing off to these), so always save the image locally and open
          // the platform's share dialog pre-filled with the text and link.
          downloadBlob(blob, filename);
          if (kind === 'twitter') {
            openShareUrl('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(pageUrl));
          } else {
            openShareUrl('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(pageUrl));
          }
          return;
        }

        // Instagram has no web share intent at all — the only way to hand it an image
        // is the OS-level native share sheet (mobile) or a manual upload from a saved file.
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name, text: text, url: pageUrl }).catch(function () {});
          return;
        }
        downloadBlob(blob, filename);
      });
    });
  });
})();
</script>
