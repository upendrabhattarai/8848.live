---
layout: default
---
<article class="card post-card">
  <span class="post-eyebrow">
    <span class="banner-dot-live"></span>
    <span data-lang-en>Daily digest</span>
    <span data-lang-np>दैनिक डाइजेस्ट</span>
  </span>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">
    <span data-lang-en>← Back to all digests</span>
    <span data-lang-np>← सबै डाइजेस्टमा फर्कनुहोस्</span>
  </a>
</article>
