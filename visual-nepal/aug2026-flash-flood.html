<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rasuwa–Bhotekoshi Flash Flood — Aug 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper:#0f1416;
    --surface:#182022;
    --surface-2:#212b2d;
    --ink:#eef3f2;
    --ink-soft:#a9b8b8;
    --line:#324043;
    --line-strong:#465759;
    --water:#5fc7e0;
    --water-strong:#8fe0f2;
    --water-tint:rgba(95,199,224,0.18);
    --ice:#d7f1f6;
    --amber:#f0a45e;
    --hazard:#e2543f;
    --hazard-tint:rgba(226,84,63,0.18);
    --shadow: 0 16px 40px -14px rgba(0,0,0,0.6), 0 2px 10px -2px rgba(0,0,0,0.45);
    --font-display:'Fraunces', 'Iowan Old Style', Georgia, serif;
    --font-body:'Manrope', 'Segoe UI', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); }

  #app{ position:relative; width:100%; display:flex; flex-direction:column; }

  /* ---- persistent flood sidebar (always visible — this page has one subject) ---- */
  #sidebar{
    width:100%; overflow-y:visible;
    background:var(--surface); border-top:1px solid var(--line);
    padding:22px 24px 32px; position:relative;
  }
  #sidebar h1{ font-family:var(--font-display); font-weight:700; font-size:1.32rem; margin:0 0 3px; color:var(--hazard); text-wrap:balance; }
  #sidebar .subtitle{ font-size:0.78rem; color:var(--ink-soft); font-weight:500; margin-bottom:14px; }
  .panel-label{ font-family:var(--font-body); font-size:0.66rem; font-weight:800; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px; }
  .panel-label:first-of-type{ margin-top:0; }
  hr.div{ border:none; border-top:1px solid var(--line); margin:14px 0; }

  .flood-disclaimer{ font-size:0.72rem; line-height:1.5; color:var(--ink-soft); background:var(--surface-2); border-left:2px solid var(--hazard); padding:7px 9px; border-radius:4px; margin-bottom:2px; }
  .flood-cause{ font-size:0.81rem; line-height:1.55; color:var(--ink); }

  .stat-card{ background:var(--surface-2); border-radius:9px; padding:10px 12px; }
  .hazard-card{ border-left:3px solid var(--hazard); }
  .hazard-card .sc-title{ color:var(--hazard); }
  .sc-title{ font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--water-strong); margin-bottom:4px; }
  .sc-vals{ font-family:var(--font-mono); font-size:1rem; font-weight:600; font-variant-numeric:tabular-nums; }
  .sc-note{ font-size:0.74rem; color:var(--ink-soft); margin-top:5px; line-height:1.45; }

  /* bulletin link — folded into the sidebar as a static item, not a floating banner */
  #bulletin-link{
    display:flex; align-items:center; gap:8px; margin-top:10px;
    background:var(--surface-2); border:1px solid var(--hazard); border-radius:8px;
    padding:9px 11px; font-size:0.76rem; color:var(--ink);
  }
  #bulletin-link .bl-dot{ width:8px; height:8px; border-radius:50%; background:var(--hazard); flex-shrink:0; animation:fbb-pulse 1.8s ease-in-out infinite; }
  @keyframes fbb-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  #bulletin-link a{ color:var(--hazard); font-weight:700; }

  .toggle-row{ display:flex; align-items:center; gap:9px; font-size:0.83rem; font-weight:600; cursor:pointer; user-select:none; padding:3px 0; }
  .toggle-row input{ accent-color:var(--hazard); width:15px; height:15px; cursor:pointer; }
  .swatch{ width:14px; height:14px; border-radius:4px; flex:none; }
  .swatch.line{ height:3px; border-radius:2px; align-self:center; }

  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-family:var(--font-body); font-size:0.72rem; font-weight:700; padding:5px 10px; border-radius:99px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; }
  .chip.active{ background:var(--hazard); color:#2a0e0a; border-color:var(--hazard); }
  .filter-row{ display:flex; flex-direction:column; gap:6px; }
  .filter-row-label{ font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-top:6px; }
  .filter-row-label:first-child{ margin-top:0; }

  .hot-stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .hot-tile{ background:var(--surface-2); border-radius:9px; padding:8px 10px; }
  .hot-tile-num{ font-family:var(--font-mono); font-size:1.05rem; font-weight:700; color:var(--water-strong); font-variant-numeric:tabular-nums; }
  .hot-tile-label{ font-size:0.68rem; color:var(--ink); font-weight:600; margin-top:1px; }
  .hot-tile-sub{ font-size:0.64rem; color:var(--ink-soft); margin-top:2px; }

  #flood-sources{ font-size:0.66rem; color:var(--ink-soft); margin-top:14px; line-height:1.7; }
  #flood-sources a, .flood-cause a{ color:var(--hazard); }
  #back-link{ display:inline-block; margin-top:16px; font-size:0.74rem; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
  #back-link:hover{ color:var(--ink); border-color:var(--line-strong); }

  button:focus-visible, input:focus-visible, .chip:focus-visible{ outline:2px solid var(--hazard); outline-offset:2px; }

  /* ---- map area ---- */
  #map-wrap{ position:relative; flex:none; height:640px; }
  #map{ position:absolute; inset:0; z-index:1; background:#0a0e0f; }
  .leaflet-container{ font-family:var(--font-body); background:#0a0e0f; }
  .leaflet-control-attribution{
    background:rgba(15,20,22,0.75) !important; color:var(--ink-soft) !important;
    font-family:var(--font-mono); font-size:0.62rem !important;
  }
  .leaflet-control-attribution a{ color:var(--water-strong) !important; }

  .float-panel{
    position:absolute; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow); z-index:450; color:var(--ink);
  }

  /* ---- info card ---- */
  #info-card{ right:18px; bottom:18px; width:300px; max-height:44vh; padding:16px 17px; overflow-y:auto; display:none; }
  #info-card.visible{ display:block; }
  #info-card .info-kicker{ font-size:0.66rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--water-strong); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #info-card .info-close{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.95rem; line-height:1; padding:2px; }
  #info-card h3{ font-family:var(--font-display); font-size:1.18rem; font-weight:700; margin:4px 0 8px; text-wrap:balance; }
  #info-card .stat-row{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.78rem; padding:4px 0; border-bottom:1px dashed var(--line); }
  #info-card .stat-row span:first-child{ color:var(--ink-soft); font-weight:600; }
  #info-card .stat-row span:last-child{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:600; }
  #info-card .info-note{ font-size:0.81rem; line-height:1.5; color:var(--ink); margin-top:10px; }
  #info-card .source-tag{ display:inline-block; margin-top:10px; font-size:0.65rem; font-weight:700; letter-spacing:0.03em; padding:3px 8px; border-radius:99px; }
  .source-mapped{ background:var(--water-tint); color:var(--water-strong); }
  .source-reference{ background:var(--surface-2); color:var(--ink-soft); }
  .source-hazard{ background:var(--hazard-tint); color:var(--hazard); }
  .source-disputed{ background:rgba(240,164,94,0.18); color:var(--amber); }

  /* ---- basemap switcher ---- */
  #basemap-switch{ position:absolute; top:18px; right:18px; z-index:450; display:flex; flex-direction:column; gap:1px; background:var(--surface); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); overflow:hidden; }
  #basemap-switch button{ font-family:var(--font-body); font-size:0.74rem; font-weight:700; padding:8px 12px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; text-align:left; }
  #basemap-switch button.active{ background:var(--hazard); color:#fff; }
  #basemap-switch button:not(.active):hover{ background:var(--surface-2); }

  #zoom-controls{ position:absolute; bottom:18px; right:18px; z-index:450; display:flex; flex-direction:column; gap:1px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); overflow:hidden; }
  #zoom-controls button{ width:32px; height:32px; border:none; background:transparent; color:var(--ink); font-size:1.05rem; cursor:pointer; font-family:var(--font-body); }
  #zoom-controls button:hover{ background:var(--surface-2); }
  #zoom-controls button + button{ border-top:1px solid var(--line); }

  #tooltip{ position:fixed; pointer-events:none; z-index:700; background:var(--ink); color:var(--paper); font-family:var(--font-body); font-size:0.76rem; font-weight:700; padding:5px 9px; border-radius:6px; transform:translate(-50%,-130%); white-space:nowrap; opacity:0; transition:opacity 0.1s; }
  #tooltip.visible{ opacity:1; }

  @media (max-width: 860px){
    #map-wrap{ height:420px; }
    #info-card{ width:min(250px, 76vw); }
  }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<div id="app">

  <div id="map-wrap">
    <div id="map" role="img" aria-label="Interactive satellite map of the Aug 2026 Rasuwa–Bhotekoshi flash flood"></div>

    <div id="basemap-switch">
      <button data-base="sat" class="active" type="button">Satellite</button>
      <button data-base="satlabels" type="button">Satellite + labels</button>
      <button data-base="topo" type="button">Topographic</button>
    </div>

    <div id="zoom-controls">
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      <button id="zoom-reset" type="button" aria-label="Reset view" style="font-size:0.7rem;">&#8635;</button>
    </div>

    <div id="info-card" class="float-panel">
      <div class="info-kicker"><span id="info-kicker-text">Feature</span><button class="info-close" id="info-close" aria-label="Close">&times;</button></div>
      <h3 id="info-title"></h3>
      <div id="info-stats"></div>
      <div class="info-note" id="info-note"></div>
      <span class="source-tag" id="info-source"></span>
    </div>

    <div id="tooltip"></div>
  </div>

  <div id="sidebar">
    <h1>⚠ Rasuwa–Bhotekoshi flash flood</h1>
    <div class="subtitle" id="flood-date"></div>
    <div class="flood-disclaimer" id="flood-disclaimer"></div>

    <div id="bulletin-link">
      <span class="bl-dot"></span>
      <span>Live casualty &amp; rescue updates: <a href="https://nirajbhusal.github.io/rasuwa-flood-bulletin/?lang=en" target="_blank" rel="noopener">Rasuwa Flood Bulletin →</a></span>
    </div>

    <div class="panel-label">Confirmed toll</div>
    <div class="stat-card hazard-card" id="flood-stats"></div>

    <div class="panel-label">Map layers</div>
    <label class="toggle-row"><input type="checkbox" data-layer="floodPath" checked><span class="swatch line" style="background:var(--hazard)"></span>Flow path &amp; impact points</label>
    <label class="toggle-row"><input type="checkbox" data-layer="floodExtent" checked><span class="swatch" style="background:var(--hazard); opacity:0.5;"></span>Modelled inundation extent</label>
    <label class="toggle-row"><input type="checkbox" data-layer="floodChange" checked><span class="swatch" style="background:linear-gradient(90deg,#c23b3b,#c9974a);"></span>Erosion / deposition</label>
    <label class="toggle-row"><input type="checkbox" data-layer="hydropower" checked><span class="swatch" style="background:var(--water); border-radius:50%;"></span>Hydropower projects</label>
    <label class="toggle-row"><input type="checkbox" data-layer="bridges" checked><span class="swatch" style="background:#fff; border-radius:50%;"></span>Bridge damage</label>

    <div class="filter-row">
      <span class="filter-row-label">Filter bridges</span>
      <div class="chips" id="bridge-filter">
        <button class="chip active" type="button" data-status="all">All</button>
        <button class="chip" type="button" data-status="Washed out">Washed out</button>
        <button class="chip" type="button" data-status="Damaged">Damaged</button>
        <button class="chip" type="button" data-status="Intact">Intact</button>
      </div>
      <span class="filter-row-label">Filter hydropower</span>
      <div class="chips" id="hydro-filter">
        <button class="chip active" type="button" data-status="all">All</button>
        <button class="chip" type="button" data-status="Operation">Operating</button>
        <button class="chip" type="button" data-status="Under Construction">Under construction</button>
        <button class="chip" type="button" data-status="Survey">Survey</button>
      </div>
    </div>

    <div class="panel-label">What happened</div>
    <div class="flood-cause" id="flood-cause"></div>

    <div class="panel-label">Active hazard</div>
    <div class="flood-cause" id="flood-hazard-note"></div>

    <div class="panel-label">Infrastructure damage (satellite mapping)</div>
    <div class="flood-cause" id="hot-note"></div>
    <div class="hot-stats-grid" id="hot-stats-grid"></div>
    <div class="flood-cause" id="hot-sources" style="margin-top:8px;"></div>

    <div id="flood-sources"></div>
  </div>

</div>

const DATA_FLOOD = {"meta":{"title":"Rasuwa\u2013Bhotekoshi flash flood","date":"26 August 2026, ~08:37 NPT","as_of":"31 August 2026, 09:00 NPT","cause_summary":"A section of glacier and rock detached at roughly 5,600 m on the north flank of Langtang Himal, inside Nepal's Langtang National Park near the China border, and came down into the Lende Khola headwaters. The debris and meltwater surge then ran down the Lende Khola gorge, which the border follows closely here: the flow left Nepal after about 1.7 km, spent roughly 24 km inside Tibet Autonomous Region (China), then crossed back into Nepal just above Rasuwagadhi and continued down the Bhote Koshi and Trishuli valleys.","sources":[{"label":"USGS \u2014 2026 Nepal Debris Avalanche and Flash Flood","url":"https://www.usgs.gov/programs/landslide-hazards/science/2026-nepal-debris-avalanche-and-flash-flood"},{"label":"PBS NewsHour \u2014 ICIMOD: avalanche 'from a glacier on the Nepal side'","url":"https://www.pbs.org/newshour/world/at-least-22-killed-and-hundreds-missing-after-avalanche-triggers-deadly-flash-floods-in-nepal"},{"label":"Al Jazeera \u2014 what happened, what caused it, who is missing","url":"https://www.aljazeera.com/news/2026/8/27/nepal-tibet-floods-what-happened-what-caused-them-and-who-is-missing"},{"label":"Al Jazeera \u2014 new lake threat on the China border","url":"https://www.aljazeera.com/news/2026/8/28/is-nepal-facing-another-devastating-flood-from-a-new-lake"},{"label":"Kathmandu Post \u2014 chain of events","url":"https://kathmandupost.com/national/2026/08/28/what-triggered-the-rasuwa-flood-scientists-piece-together-a-complex-chain-of-events"},{"label":"The Himalayan Times \u2014 casualty count, 31 Aug","url":"https://thehimalayantimes.com/nepal/more-than-10000-rescued-as-rasuwa-flood-toll-reaches-903"},{"label":"Copernicus EMS \u2014 Rapid Mapping EMSR927","url":"https://mapping.emergency.copernicus.eu/news/flood-in-nepal-emsr927/"},{"label":"geo-pera \u2014 Bhote Koshi 2026: open-satellite-data reconstruction (route, extent, erosion/deposition, SAR change detection)","url":"https://geopera.com/blog/bhote-koshi-flood-2026-satellite-analysis"},{"label":"geo-pera/bhotekoshi-2026-reconstruction \u2014 data & code (CC BY-NC 4.0, MIT)","url":"https://github.com/geo-pera/bhotekoshi-2026-reconstruction"},{"label":"HOT/HDX \u2014 hot_flood_npl: hydropower, bridges & damage assessment (OSM/Overture/Meta, ODbL)","url":"https://data.humdata.org/dataset/hot_flood_npl"}],"disclaimer":"This is an active disaster and figures are still changing day to day. The route, flood extent, erosion/deposition and settlement timings are drawn from an independent open-data satellite reconstruction \u2014 the authors themselves call it 'a rapid scientific reconstruction, not an official assessment,' built from Planet/Vantor imagery, Sentinel-1, Copernicus GLO-30 and NASA HMA DEMs. Casualty figures are separately reported press values, not outputs of that model. Check Nepal's National Disaster Risk Reduction and Management Authority for the official, current situation."},"stats":{"deaths":903,"missing":4247,"rescued":10451,"injured":267,"bridges_destroyed":19,"roads_destroyed_km":40,"missing_breakdown":"Rasuwa 865 \u00b7 Nuwakot 1,558 \u00b7 hydropower project sites 933 \u00b7 foreign nationals 592","source":"The Himalayan Times, 31 Aug 2026 09:00 NPT","source_url":"https://thehimalayantimes.com/nepal/more-than-10000-rescued-as-rasuwa-flood-toll-reaches-903"},"hot_damage_assessment":{"label":"HOT/OSM satellite damage mapping","snapshot":"31 August 2026, 18:08 UTC","assessed_through":"26\u201327 August 2026","note":"Independent, separately-sourced from the geo-pera reconstruction above: this is OpenStreetMap's Humanitarian OpenStreetMap Team (HOT) rapid damage assessment for the Bhote Koshi\u2013Trishuli corridor (a 90 km\u00b2 buffer along the river), built from OSM, Overture Maps and Meta building layers, tagged standing/damaged/destroyed from post-event satellite imagery. It disagrees with the press-reported bridge count below (43 here vs. 19 from The Himalayan Times) because it counts every crossing in the corridor buffer, not just ones officials had confirmed destroyed by 31 Aug \u2014 both numbers are shown rather than picking one.","categories":[{"key":"buildings","label":"Buildings","total":19600,"standing":17970,"destroyed":1615,"damaged":15},{"key":"roads","label":"Roads","total":2204,"standing":1932,"destroyed":272,"damaged":0},{"key":"waterways","label":"Waterways","total":373,"standing":330,"destroyed":43,"damaged":0},{"key":"bridges","label":"Bridges","total":167,"standing":124,"destroyed":43,"damaged":0},{"key":"education","label":"Education facilities","total":60,"standing":54,"destroyed":6,"damaged":0},{"key":"health","label":"Health facilities","total":5,"standing":5,"destroyed":0,"damaged":0},{"key":"destroyed_all","label":"All destroyed/damaged features (any type)","total":2077,"standing":null,"destroyed":2061,"damaged":16},{"key":"populated_places","label":"Populated places in corridor","total":292,"standing":null,"destroyed":null,"damaged":null}],"sources":[{"label":"HOT Raw Data Export \u2014 hot_flood_npl overview (layer counts, licensing)","url":"https://production-raw-data-api.s3.amazonaws.com/ISO3/NPL/overview/hot_flood_npl_overview.html"},{"label":"HDX \u2014 Nepal Flood 2026 (hot_flood_npl) dataset page","url":"https://data.humdata.org/dataset/hot_flood_npl"}]},"origin":{"lat":28.266,"lon":85.564,"elev_m":5600,"name":"Glacier / bedrock detachment zone","note":"Sentinel-1 change detection (16\u219228 Aug) picked out a cluster of new-dark surface-change patches here, interpreted as the detachment zone that triggered the flood, roughly 5,600 m up on the north flank of Langtang Himal. This is where the collapse that triggered everything downstream is believed to have begun.","tier":"mapped"},"hazard_lake":{"lat":28.335,"lon":85.439,"elev_m":2377,"name":"New barrier lake \u2014 active hazard (Tibet side)","note":"Roughly the midpoint of the debris-choked Lende Khola gorge on the Tibet side. Avalanche debris dammed the river here; meltwater and debris continue to pond behind it. Chinese authorities estimated 1.5\u20132 million m\u00b3 held back as of late August, with several million m\u00b3 more flowing in \u2014 officials warn a further breach could send a fast-moving debris flood downstream with very little warning. Location is approximate.","tier":"hazard"},"extra_impacts":[{"name":"Upper Trishuli-1 hydropower project","lat":28.05,"lon":85.22,"elev_m":900,"note":"Around 350 workers and residents were trapped in an underground tunnel when the flood hit; hydropower sites account for 933 of the total missing. Not part of the modelled settlement list below \u2014 plotted from press reports.","tier":"reference"}]};

/* ---- app ---- */
(function(){
  /* ---------- base map ---------- */
  var map = L.map('map', {
    zoomControl: false,
    maxZoom: 18,
    worldCopyJump: false,
    maxBoundsViscosity: 1.0
  });

  var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, maxNativeZoom: 18,
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics, GIS User Community'
  });
  var refLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, maxNativeZoom: 18, pane: 'overlayPane',
    attribution: ''
  });
  var topo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, maxNativeZoom: 18,
    attribution: 'Esri, HERE, Garmin, FAO, NOAA, USGS'
  });

  satellite.addTo(map);
  map.invalidateSize();

  document.querySelectorAll('#basemap-switch button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('#basemap-switch button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      map.removeLayer(satellite); map.removeLayer(topo); map.removeLayer(refLabels);
      var mode = btn.dataset.base;
      if(mode === 'sat'){ satellite.addTo(map); }
      else if(mode === 'satlabels'){ satellite.addTo(map); refLabels.addTo(map); }
      else if(mode === 'topo'){ topo.addTo(map); }
    });
  });

  var canvasRenderer = L.canvas({ padding: 0.3 });
  function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }

  /* ---------- Aug 2026 flash flood — real reconstructed route, extent & land change ---------- */

  // modelled peak inundation extent (real polygon, geo-pera reconstruction)
  var floodExtentLayer = L.geoJSON(DATA_FLOOD_EXTENT, {
    renderer: canvasRenderer,
    style: { color: getCss('--hazard'), weight: 1, opacity: 0.7, fillColor: getCss('--hazard'), fillOpacity: 0.32 }
  });
  floodExtentLayer.on('mousemove', function(ev){ showTooltip(ev, 'Modelled peak inundation, 26 Aug'); });
  floodExtentLayer.on('mouseout', hideTooltip);
  floodExtentLayer.addTo(map);

  // route + impact points bundle
  var floodPathGroup = L.layerGroup();

  // the actual reconstructed river/flood centerline — real chainage-sampled waterway, not a straight line
  var floodPath = L.geoJSON(DATA_FLOOD_PATH, {
    renderer: canvasRenderer,
    style: { color: getCss('--hazard'), weight: 3.4, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }
  });
  floodPath.on('mousemove', function(ev){ showTooltip(ev, 'Reconstructed flow path (' + DATA_FLOOD_PATH.features[0].properties.length_km + ' km)'); });
  floodPath.on('mouseout', hideTooltip);
  floodPath.on('click', function(){
    openInfo({
      kicker: '26 Aug 2026 · reconstructed from satellite data',
      title: 'Flood flow path',
      stats: [['Length modelled', DATA_FLOOD_PATH.features[0].properties.length_km + ' km']],
      note: 'The exact routed centerline of the flood, chainage-sampled from a DEM-referenced satellite reconstruction — not a schematic. It leaves Nepal ~1.7 km below the origin, runs about 24 km through Tibet, then crosses back into Nepal above Rasuwagadhi.',
      source: 'mapped'
    });
  });
  floodPath.addTo(floodPathGroup);

  function floodDot(lat, lon, radius, fillOpacity, dash){
    return L.circleMarker([lat, lon], { renderer: canvasRenderer, radius: radius, color: getCss('--hazard'), weight: 2, fillColor: getCss('--hazard'), fillOpacity: fillOpacity, dashArray: dash||null });
  }

  var originMarker = floodDot(DATA_FLOOD.origin.lat, DATA_FLOOD.origin.lon, 8, 0.85);
  originMarker.on('mousemove', function(ev){ showTooltip(ev, DATA_FLOOD.origin.name); });
  originMarker.on('mouseout', hideTooltip);
  originMarker.on('click', function(){
    openInfo({ kicker: 'Trigger · ~' + DATA_FLOOD.origin.elev_m + ' m · Langtang Himal, near the border', title: DATA_FLOOD.origin.name, stats: [], note: DATA_FLOOD.origin.note, source: DATA_FLOOD.origin.tier });
  });
  originMarker.addTo(floodPathGroup);

  var hazardMarker = floodDot(DATA_FLOOD.hazard_lake.lat, DATA_FLOOD.hazard_lake.lon, 9, 0.4, '3 3');
  hazardMarker.on('mousemove', function(ev){ showTooltip(ev, DATA_FLOOD.hazard_lake.name); });
  hazardMarker.on('mouseout', hideTooltip);
  hazardMarker.on('click', function(){
    openInfo({ kicker: 'Active hazard · ~' + DATA_FLOOD.hazard_lake.elev_m + ' m · Tibet side', title: DATA_FLOOD.hazard_lake.name, stats: [], note: DATA_FLOOD.hazard_lake.note, source: 'hazard' });
  });
  hazardMarker.addTo(floodPathGroup);

  // real modelled settlement impact points (arrival time + peak depth)
  DATA_FLOOD_SETTLEMENTS.features.forEach(function(f){
    var p = f.properties;
    var latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    var m = L.circleMarker(latlng, { renderer: canvasRenderer, radius: 5.5, color: getCss('--hazard'), weight: 2, fillColor: getCss('--hazard'), fillOpacity: 0.8 });
    m.on('mousemove', function(ev){ showTooltip(ev, p.site + ' · ' + p.modelled_peak_depth_m + ' m peak'); });
    m.on('mouseout', hideTooltip);
    m.on('click', function(){
      openInfo({
        kicker: 'Flood impact · chainage ' + p.chainage_km + ' km',
        title: p.site,
        stats: [['Modelled arrival', p.modelled_arrival_NPT + ' NPT (+' + p.minutes_after_collapse + ' min)'], ['Peak depth', p.modelled_peak_depth_m + ' m']],
        note: 'Arrival and depth are model outputs from the satellite-based reconstruction, calibrated to observed trimlines — not a survey measurement.',
        source: 'mapped'
      });
    });
    m.addTo(floodPathGroup);
  });

  // supplementary press-reported impact points not covered by the model
  DATA_FLOOD.extra_impacts.forEach(function(imp){
    var m = floodDot(imp.lat, imp.lon, 5, 0.6, '2 2');
    m.on('mousemove', function(ev){ showTooltip(ev, imp.name); });
    m.on('mouseout', hideTooltip);
    m.on('click', function(){
      openInfo({ kicker: 'Flood impact · ~' + imp.elev_m + ' m elevation', title: imp.name, stats: [], note: imp.note, source: imp.tier });
    });
    m.addTo(floodPathGroup);
  });

  floodPathGroup.addTo(map);

  /* ---------- hydropower projects exposed to the flood corridor (HOT/HDX) ---------- */
  var HYDRO_COLOR = { 'Operation': '#5fc7e0', 'Under Construction': getCss('--amber'), 'Survey': '#8a9a9a' };
  var hydropowerLayer = L.layerGroup();
  var hydropowerMarkers = [];
  DATA_FLOOD_HYDROPOWER.features.forEach(function(f){
    var p = f.properties;
    var latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    var col = HYDRO_COLOR[p.status] || '#8a9a9a';
    var m = L.circleMarker(latlng, { renderer: canvasRenderer, radius: 6, color: '#fff', weight: 1.4, fillColor: col, fillOpacity: 0.9,
      dashArray: p.status === 'Survey' ? '2 2' : null });
    m.on('mousemove', function(ev){ showTooltip(ev, p.name + ' · ' + p.capacity_mw + ' MW'); });
    m.on('mouseout', hideTooltip);
    m.on('click', function(){
      openInfo({
        kicker: p.status + ' · ' + p.river + ' river · ' + p.district,
        title: p.name,
        stats: [['Capacity', p.capacity_mw + ' MW'], ['Status', p.status], ['District', p.district + ', ' + p.municipality]],
        note: 'Hydropower project inside the flood-affected Bhote Koshi–Trishuli corridor, from HOT/HDX’s exposed-infrastructure layer for this event.',
        source: 'mapped'
      });
    });
    m.addTo(hydropowerLayer);
    hydropowerMarkers.push({ status: p.status, layer: m });
  });
  hydropowerLayer.addTo(map);

  /* ---------- bridge damage assessment along the corridor (HOT/HDX) ---------- */
  var BRIDGE_COLOR = { 'Washed out': getCss('--hazard'), 'Damaged': getCss('--amber'), 'Intact': '#6fcf7d' };
  var bridgeLayer = L.layerGroup();
  var bridgeMarkers = [];
  DATA_FLOOD_BRIDGES.features.forEach(function(f){
    var p = f.properties;
    var latlng = [f.geometry.coordinates[1], f.geometry.coordinates[0]];
    var col = BRIDGE_COLOR[p.status] || '#8a9a9a';
    var m = L.circleMarker(latlng, { renderer: canvasRenderer, radius: 4, color: '#fff', weight: 1, fillColor: col, fillOpacity: 0.9 });
    m.on('mousemove', function(ev){ showTooltip(ev, p.name + ' · ' + p.status); });
    m.on('mouseout', hideTooltip);
    m.on('click', function(){
      openInfo({
        kicker: 'Bridge · ' + p.status,
        title: p.name,
        stats: [['Status', p.status]],
        note: 'From HOT/HDX’s post-event satellite damage assessment for this corridor (hot_flood_npl_bridge_damage). “Washed out” and “Damaged” are the source dataset’s own status categories.',
        source: 'mapped'
      });
    });
    m.addTo(bridgeLayer);
    bridgeMarkers.push({ status: p.status, layer: m });
  });
  bridgeLayer.addTo(map);

  /* ---------- filters: show/hide markers by status without removing the layer ---------- */
  function wireStatusFilter(containerId, markers){
    var el = document.getElementById(containerId);
    if(!el) return;
    el.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        el.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        var want = btn.dataset.status;
        markers.forEach(function(rec){
          var show = (want === 'all') || (rec.status === want);
          rec.layer.setStyle({ opacity: show ? 1 : 0, fillOpacity: show ? 0.9 : 0 });
          rec.layer.options.interactive = show;
        });
      });
    });
  }
  wireStatusFilter('bridge-filter', bridgeMarkers);
  wireStatusFilter('hydro-filter', hydropowerMarkers);

  // erosion (channel/bank scour) + deposition (new sediment/debris) — real stereo-measured land change
  var floodChangeGroup = L.layerGroup();
  var erosionLayer = L.geoJSON(DATA_FLOOD_EROSION, {
    renderer: canvasRenderer,
    style: { color: '#c23b3b', weight: 0.5, opacity: 0.7, fillColor: '#c23b3b', fillOpacity: 0.55 }
  });
  erosionLayer.on('mousemove', function(ev){ showTooltip(ev, 'Erosion — bank/channel scour'); });
  erosionLayer.on('mouseout', hideTooltip);
  erosionLayer.addTo(floodChangeGroup);

  var depositionLayer = L.geoJSON(DATA_FLOOD_DEPOSITION, {
    renderer: canvasRenderer,
    style: { color: '#c9974a', weight: 0.5, opacity: 0.7, fillColor: '#c9974a', fillOpacity: 0.55 }
  });
  depositionLayer.on('mousemove', function(ev){ showTooltip(ev, 'Deposition — new sediment/debris'); });
  depositionLayer.on('mouseout', hideTooltip);
  depositionLayer.addTo(floodChangeGroup);
  floodChangeGroup.addTo(map);

  /* ---------- zoom/bounds: lock the view to the flood corridor, not all of Nepal ---------- */
  var corridorBounds = floodPath.getBounds().extend(floodExtentLayer.getBounds());
  var fitZoom = map.getBoundsZoom(corridorBounds, false, L.point(40, 40));
  map.setMinZoom(Math.max(1, fitZoom - 2));
  map.setMaxBounds(corridorBounds.pad(1.2));
  map.fitBounds(corridorBounds, { padding: [40, 40] });

  /* ---------- layer toggles ---------- */
  var layerMap = { floodPath: floodPathGroup, floodExtent: floodExtentLayer, floodChange: floodChangeGroup, hydropower: hydropowerLayer, bridges: bridgeLayer };
  document.querySelectorAll('input[data-layer]').forEach(function(cb){
    cb.addEventListener('change', function(){
      var lyr = layerMap[cb.dataset.layer];
      if(cb.checked) map.addLayer(lyr); else map.removeLayer(lyr);
    });
  });

  /* ---------- tooltip ---------- */
  var tooltip = document.getElementById('tooltip');
  function showTooltip(ev, text){
    tooltip.textContent = text;
    var oe = ev.originalEvent || ev;
    tooltip.style.left = oe.clientX + 'px';
    tooltip.style.top = oe.clientY + 'px';
    tooltip.classList.add('visible');
  }
  function hideTooltip(){ tooltip.classList.remove('visible'); }

  /* ---------- info card ---------- */
  var infoCard = document.getElementById('info-card');
  function openInfo(opts){
    document.getElementById('info-kicker-text').textContent = opts.kicker || 'Feature';
    document.getElementById('info-title').textContent = opts.title;
    var statsEl = document.getElementById('info-stats');
    statsEl.innerHTML = '';
    (opts.stats||[]).forEach(function(pair){
      var row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = '<span>'+pair[0]+'</span><span>'+pair[1]+'</span>';
      statsEl.appendChild(row);
    });
    document.getElementById('info-note').textContent = opts.note || '';
    var src = document.getElementById('info-source');
    if(opts.source === 'mapped'){ src.textContent = 'Mapped — real data'; src.className = 'source-tag source-mapped'; }
    else if(opts.source === 'hazard'){ src.textContent = 'Active hazard — press reports'; src.className = 'source-tag source-hazard'; }
    else if(opts.source === 'disputed'){ src.textContent = 'Disputed — sources disagree'; src.className = 'source-tag source-disputed'; }
    else { src.textContent = 'Reference location — curated'; src.className = 'source-tag source-reference'; }
    infoCard.classList.add('visible');
  }
  document.getElementById('info-close').onclick = function(){ infoCard.classList.remove('visible'); };

  /* ---------- zoom controls ---------- */
  document.getElementById('zoom-in').onclick = function(){ map.zoomIn(); };
  document.getElementById('zoom-out').onclick = function(){ map.zoomOut(); };
  document.getElementById('zoom-reset').onclick = function(){ map.fitBounds(corridorBounds, { padding:[40,40] }); };

  /* ---------- sidebar content: flood stats, methodology, sourcing ---------- */
  document.getElementById('flood-date').textContent = DATA_FLOOD.meta.date + '  ·  updated ' + DATA_FLOOD.meta.as_of;
  document.getElementById('flood-disclaimer').textContent = DATA_FLOOD.meta.disclaimer;
  document.getElementById('flood-cause').textContent = DATA_FLOOD.meta.cause_summary;
  document.getElementById('flood-hazard-note').textContent = DATA_FLOOD.hazard_lake.note;
  var fs = DATA_FLOOD.stats;
  document.getElementById('flood-stats').innerHTML =
    '<div class="sc-title">Confirmed toll — ' + fs.source + '</div>' +
    '<div class="sc-vals">' + fs.deaths.toLocaleString() + ' dead &nbsp;·&nbsp; ' + fs.missing.toLocaleString() + ' missing &nbsp;·&nbsp; ' + fs.rescued.toLocaleString() + ' rescued</div>' +
    '<div class="sc-note">' + fs.injured + ' injured &nbsp;·&nbsp; ' + fs.bridges_destroyed + ' bridges destroyed &nbsp;·&nbsp; ~' + fs.roads_destroyed_km + ' km of roads destroyed</div>' +
    '<div class="sc-note">Missing by area: ' + fs.missing_breakdown + '</div>';
  document.getElementById('flood-sources').innerHTML = '<strong>Sources:</strong> ' + DATA_FLOOD.meta.sources.map(function(s){ return '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.label+'</a>'; }).join('; ');

  var hot = DATA_FLOOD.hot_damage_assessment;
  document.getElementById('hot-note').textContent = 'Snapshot ' + hot.snapshot + ', assessed from imagery through ' + hot.assessed_through + '. ' + hot.note;
  document.getElementById('hot-stats-grid').innerHTML = hot.categories.map(function(c){
    var sub = (c.destroyed !== null) ? (c.destroyed.toLocaleString() + ' destroyed' + (c.damaged ? ' · ' + c.damaged.toLocaleString() + ' damaged' : '')) : 'not damage-tagged';
    return '<div class="hot-tile"><div class="hot-tile-num">' + c.total.toLocaleString() + '</div><div class="hot-tile-label">' + c.label + '</div><div class="hot-tile-sub">' + sub + '</div></div>';
  }).join('');
  document.getElementById('hot-sources').innerHTML = '<strong>Damage-assessment source:</strong> ' + hot.sources.map(function(s){ return '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.label+'</a>'; }).join('; ');

})();

</script>

<button id="scroll-top-btn" class="scroll-top-btn" type="button" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
</button>
<script>
(function () {
  var themeBtn = document.getElementById('theme-toggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  }
  var langBtn = document.getElementById('lang-toggle');
  if (langBtn) {
    langBtn.addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.getAttribute('data-lang') === 'np' ? 'np' : 'en';
      var next = current === 'np' ? 'en' : 'np';
      root.setAttribute('data-lang', next);
      try { localStorage.setItem('lang', next); } catch (e) {}
    });
  }
  var scrollBtn = document.getElementById('scroll-top-btn');
  if (scrollBtn) {
    var toggleVisible = function () {
      if (window.scrollY > 420) { scrollBtn.classList.add('visible'); }
      else { scrollBtn.classList.remove('visible'); }
    };
    window.addEventListener('scroll', toggleVisible, { passive: true });
    toggleVisible();
    scrollBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
})();
</script>
</body>
</html>
